# Newest first. The home page shows the first three.
- date: 2026-11-14
  title: Valley X opens BIOBUZZ with an Inspire Award
  teams: ["2844", "12841"]
  body: >-
    Both FTC teams made the playoffs at the Roadrunner – Gilbert Qualifier, the first event of
    the 2026–27 season. Valley X took home the Inspire Award 3rd Place, and +3 ranked 11th of 27.

- date: 2026-05-31
  title: Valley X competes at the Western Edge Premier Event
  teams: ["2844"]
  body: >-
    Valley X closed out DECODE in the Sea Division of the Western Edge Premier Event. Between
    matches, the team ran a request board in its pit and filled 37 part and tool requests for
    other teams.

- date: 2026-02-21
  title: Varsity and JV on the same alliance at State
  teams: ["2844", "12841"]
  body: >-
    At the Arizona Championship, Valley X ranked 2nd of 25 in the Grand Canyon Division and picked
    +3 for its alliance. The two teams made the division final together, and +3 earned the Reach
    Award 3rd Place.

- date: 2026-01-24
  title: Inspire Award at the Microchip Qualifier
  teams: ["2844", "12841"]
  body: >-
    Valley X won the Inspire Award, FTC's top honor, at the Saguaro Blossom – Microchip
    Qualifier #2, and +3 won the Think Award for its engineering portfolio.
