  scout_url: https://www.thebluealliance.com/team/8848
  tagline: Full-size FRC robots, built by Valley Christian High School students since 2022.
  summary: >-
    BLU CRU is Valley Christian's FIRST Robotics Competition team. FRC robots are
    industrial-sized, built over an intense winter build season, and played on a full-size field.
    That means serious engineering, plus the fundraising, business planning, and community work
    that keep a team running.
  facts:
    - value: "2022"
      label: Rookie year
    - value: "Houston"
      label: Worlds as a rookie
    - value: "25+"
      label: Students
  robots:
    - season: "2022 · RAPID REACT"
      name: Fabio
    - season: "2025 · REEFSCAPE"
      name: BUBBLES (In a Deep Voice)
  highlights:
    - title: Rookie All Star, 2022
      body: >-
        In its very first season, BLU CRU ranked 5th of 35 at the Arizona Valley Regional and won
        the Highest Rookie Seed and Rookie All Star awards, which sent the team to the FIRST
        Championship in Houston (Newton Division).
    - title: Industrial Design Award, 2023
      body: Recognized at the Arizona West Regional during CHARGED UP.
    - title: REEFSCAPE 2025
      body: >-
        Reached the playoffs at the Arizona East Regional as the first pick of Alliance 8.
