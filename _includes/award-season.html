{% assign s = include.season %}
<article class="season">
  <header class="season__head">
    <span class="season__year mono">{{ s.season }}</span>
    <span class="season__game">{{ s.game }}</span>
    <span class="season__count">{{ s.awards.size }} {% if s.awards.size == 1 %}award{% else %}awards{% endif %}</span>
  </header>
  <ul class="award-list">
    {% for a in s.awards %}
    <li class="award{% if a.major %} award--major{% endif %}">
      <span class="award__name">{{ a.award }}</span>
      <span class="award__event">{{ a.event }}</span>
    </li>
    {% endfor %}
  </ul>
</article>
