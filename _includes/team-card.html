{% assign t = include.team %}
<a class="team-card{% if t.status == 'hiatus' %} team-card--hiatus{% endif %}" href="{{ t.url | relative_url }}">
  <span class="team-card__media">
    {% if t.photo %}
    <picture>
      <source srcset="{{ '/assets/img/photos/' | append: t.photo | append: '.webp' | relative_url }}" type="image/webp">
      <img src="{{ '/assets/img/photos/' | append: t.photo | append: '.jpg' | relative_url }}" alt="" width="{{ t.photo_w }}" height="{{ t.photo_h }}" loading="lazy" decoding="async">
    </picture>
    {% else %}
    <span class="team-card__placeholder mono" aria-hidden="true">{{ t.number }}</span>
    {% endif %}
  </span>
  <span class="team-card__body">
    <span class="team-card__program">{{ t.program }} {{ t.number }} · {% if t.status == 'hiatus' %}On hiatus{% else %}{{ t.level }}{% endif %}</span>
    <span class="team-card__name">{{ t.name }}</span>
    <span class="team-card__tagline">{{ t.tagline }}</span>
    <span class="team-card__link">Meet {{ t.short }}</span>
  </span>
</a>
