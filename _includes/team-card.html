{% assign t = include.team %}
<a class="team-card team-card--{{ t.id }}{% if t.status == 'hiatus' %} team-card--hiatus{% endif %}" href="{{ t.url | relative_url }}">
  <span class="team-card__top">
    <span class="team-card__program mono">{{ t.program }}</span>
    {% if t.status == 'hiatus' %}<span class="badge badge--hiatus">On hiatus</span>{% else %}<span class="badge badge--{{ t.id }}">{{ t.level }}</span>{% endif %}
  </span>
  <span class="team-card__number mono">{{ t.number }}</span>
  <span class="team-card__name">{{ t.name }}</span>
  <span class="team-card__tagline">{{ t.tagline }}</span>
  <span class="team-card__link">Meet {{ t.short }} <span aria-hidden="true">→</span></span>
</a>
